<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스크롤</title>
    <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <section class="hero">
      <h1 class="title">WCB Fashion<br />Collection</h1>
    </section>
    <section class="concept">
      <div class="wrapper">
        <h2 class="title fadein">Concept</h2>
        <p class="fadein">
          매일 당연했던 날들을 조금 더 화려하게 꾸미고 싶다는 생각에서 새로운
          패션 브랜드가 생겨났습니다.
        </p>
      </div>
      <img src="images/concept.jpg" alt="" />
    </section>

    <section class="gallery">
      <div class="gallery-image">
        <img src="images/img1.jpg" alt="" />
      </div>
      <div class="gallery-content wrapper">
        <h2 class="title fadein">Lookbook</h2>
        <ul class="gallery-thumbnails">
          <li class="fadein"><img src="images/img1.jpg" alt="" /></li>
          <li class="fadein"><img src="images/img2.jpg" alt="" /></li>
        </ul>
      </div>
    </section>

    <section class="shop">
      <div class="shop-content wrapper">
        <h2 class="title fadein">Shop</h2>
        <p class="fadein">언제나 무료 배송. 편리한 온라인샵을 이용해주세요.</p>
        <a class="btn fadein" href="#">온라인샵</a>

        <h3 class="fadein">롯폰기점</h3>
        <p class="fadein">
          도쿄도 미나토구 롯폰기2-4-5<br />
          영업일 : 금/토/일/휴일<br />
          영업시간 : 11:00 - 18:00
        </p>
      </div>
    </section>
  </body>
</html>
